apiGateway:
  replicaCount: 1
  image:
    repository: api-gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: NodePort
    port: 8001
    targetPort: 8001
  kserveUrl: http://ocr-model:8080/v2/models/ocr-model/infer
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

ocrModel:
  replicaCount: 1
  image:
    repository: ocr-model
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
