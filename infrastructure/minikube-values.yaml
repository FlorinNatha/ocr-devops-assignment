global:
  namespace: ocr

images:
  apiGateway:
    repository: api-gateway
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  ocrModel:
    repository: ocr-model
    tag: "1.0.0"
    pullPolicy: IfNotPresent

apiGateway:
  replicas: 1
  service:
    type: NodePort
    port: 8001
    targetPort: 8001
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

ocrModel:
  replicas: 1
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  readinessProbe:
    path: /v2/health/ready
    port: 8080

env:
  KSERVE_URL: http://ocr-model:8080/v2/models/ocr-model/infer
