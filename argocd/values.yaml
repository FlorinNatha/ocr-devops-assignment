global:
  logging:
    format: text
    level: info
  image:
    imagePullPolicy: IfNotPresent

controller:
  replicas: 1
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 800m
      memory: 768Mi

server:
  replicas: 1
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 75m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 384Mi

repoServer:
  replicas: 1
  resources:
    requests:
      cpu: 150m
      memory: 384Mi
    limits:
      cpu: 800m
      memory: 768Mi

applicationSet:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

redis:
  image:
    imagePullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 75m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 192Mi

notifications:
  enabled: false

dex:
  enabled: false
