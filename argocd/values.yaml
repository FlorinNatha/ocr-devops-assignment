global:
  logging:
    format: text
    level: info
  image:
    imagePullPolicy: IfNotPresent

controller:
  replicas: 1
  progressDeadlineSeconds: 1200   # allow 20 min for image pull on slow networks
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

server:
  replicas: 1
  progressDeadlineSeconds: 1200
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 600m
      memory: 512Mi

repoServer:
  replicas: 1
  progressDeadlineSeconds: 1200
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi

applicationSet:
  replicas: 1
  progressDeadlineSeconds: 1200
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 400m
      memory: 384Mi

redis:
  image:
    imagePullPolicy: IfNotPresent
  # Use the pre-created argocd-redis secret instead of the generated one.
  # This works in tandem with redisSecretInit.enabled=false.
  existingSecret: argocd-redis
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi

notifications:
  enabled: false

dex:
  enabled: false
