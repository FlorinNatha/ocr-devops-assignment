apiVersion: v1
kind: Secret
metadata:
  name: argocd-redis
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: argocd
type: Opaque
stringData:
  # Redis password used by ArgoCD internally.
  # Pre-creating this secret causes the argocd-redis-secret-init
  # pre-install Job to skip generation and exit immediately.
  auth: "argoRedisPass123"
