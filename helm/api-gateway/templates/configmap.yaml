# Keeps the model endpoint configurable without rebuilding the image.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "api-gateway.fullname" . }}-config
  labels:
    app.kubernetes.io/name: {{ include "api-gateway.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  KSERVE_URL: {{ .Values.apiGateway.kserveUrl | quote }}
