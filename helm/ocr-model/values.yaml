# Default settings for the KServe OCR model chart.
ocrModel:
  replicaCount: 1
  image:
    repository: ocr-model
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
    targetPort: 8080
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi
  imagePullSecrets: []
  serviceAccount:
    create: true
    name: ""
