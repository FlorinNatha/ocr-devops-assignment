# Explicit empty RBAC policy: the model does not call the Kubernetes API.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ocr-model.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ocr-model.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ocr-model.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ocr-model.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ocr-model.serviceAccountName" . }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ocr-model.fullname" . }}
