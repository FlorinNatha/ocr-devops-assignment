# Runs the KServe OCR model with Tesseract inside the container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ocr-model.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "ocr-model.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.ocrModel.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "ocr-model.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "ocr-model.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "ocr-model.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- if .Values.ocrModel.imagePullSecrets }}
      imagePullSecrets:
        {{- range .Values.ocrModel.imagePullSecrets }}
        - name: {{ . | quote }}
        {{- end }}
      {{- end }}
      securityContext:
        # The model only serves HTTP and does not need Kubernetes API access.
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: model
          image: "{{ .Values.ocrModel.image.repository }}:{{ .Values.ocrModel.image.tag }}"
          imagePullPolicy: {{ .Values.ocrModel.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 8082
              protocol: TCP
          readinessProbe:
            # Traffic is sent only after the KServe health endpoint is ready.
            httpGet:
              path: /v2/health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /v2/health/live
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            {{- toYaml .Values.ocrModel.resources | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
