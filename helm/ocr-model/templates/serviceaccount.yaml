# Dedicated identity for the model with no mounted API token.
{{- if .Values.ocrModel.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ocr-model.serviceAccountName" . }}
  labels:
    app.kubernetes.io/name: {{ include "ocr-model.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
automountServiceAccountToken: false
{{- end }}
