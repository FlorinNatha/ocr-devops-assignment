apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: monitoring
type: Opaque
stringData:
  # Replace these values before applying.
  # To generate a strong password:
  #   openssl rand -base64 24
  admin-user: admin
  admin-password: adminPass
